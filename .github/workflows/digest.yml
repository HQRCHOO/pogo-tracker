name: digest
on:
  schedule:
    - cron: "0 14 * * *"          # 7 AM PT on daylight time
    - cron: "0 15 * * *"          # 7 AM PT on standard time (the script skips the wrong one)
  workflow_dispatch: {}           # manual test: posts right away

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m poller.digest
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
